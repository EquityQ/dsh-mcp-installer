name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Scan for literal provider tokens
        run: npm run scan:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify built bundle
        run: |
          node scripts/verify-build.mjs
          node scripts/verify-client.mjs
          node scripts/verify-safety.mjs
